<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autos Colombia | Clientes</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-mark">AC</div>
    <div><h1>Autos Colombia</h1><p>Gestión de clientes</p></div>
    <nav class="nav"><a href="/">Parqueadero</a><a href="/celdas.html">Celdas</a></nav>
  </header>
  <main class="container">
    <div id="message" class="message" role="status" hidden></div>
    <section class="layout">
      <article class="panel">
        <div class="panel-heading"><div><p class="eyebrow">NUEVO CLIENTE</p><h3>Registrar cliente</h3></div><span class="step">01</span></div>
        <form id="client-form">
          <div class="form-row">
            <div><label for="document-type">Tipo de documento</label>
              <select id="document-type" name="documentType"><option value="CC">Cédula de ciudadanía</option><option value="CE">Cédula de extranjería</option><option value="PASAPORTE">Pasaporte</option></select></div>
            <div><label for="document-number">Número de documento</label><input id="document-number" name="documentNumber" maxlength="20" required placeholder="Ej. 1020304050"></div>
          </div>
          <label for="full-name">Nombre completo</label>
          <input id="full-name" name="fullName" maxlength="120" required placeholder="Nombres y apellidos">
          <div class="form-row">
            <div><label for="phone">Teléfono</label><input id="phone" name="phone" maxlength="20" required placeholder="Ej. 3001234567"></div>
            <div><label for="email">Correo <span class="optional">Opcional</span></label><input id="email" name="email" type="email" maxlength="120" placeholder="correo@ejemplo.com"></div>
          </div>
          <button type="submit">Registrar cliente <span>→</span></button>
        </form>
      </article>
      <article class="panel list-panel">
        <div class="panel-heading"><div><p class="eyebrow">CONSULTA</p><h3>Clientes</h3></div></div>
        <form id="search-form" class="search-form">
          <input id="search-term" aria-label="Buscar por documento o nombre" placeholder="Buscar por documento o nombre">
          <button type="submit" class="secondary">Buscar</button>
        </form>
        <div class="table-wrap"><table><thead><tr><th>Documento</th><th>Nombre</th><th>Teléfono</th><th>Vehículos</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="clients-body"><tr><td colspan="6" class="empty">Cargando clientes…</td></tr></tbody></table></div>
      </article>
    </section>
    <section class="panel" id="detail-panel" hidden>
      <div class="panel-heading"><div><p class="eyebrow">DETALLE</p><h3 id="detail-title">Cliente</h3></div></div>
      <div class="layout">
        <div>
          <form id="edit-form">
            <div class="form-row">
              <div><label for="e-document-type">Tipo de documento</label>
                <select id="e-document-type" name="documentType"><option value="CC">Cédula de ciudadanía</option><option value="CE">Cédula de extranjería</option><option value="PASAPORTE">Pasaporte</option></select></div>
              <div><label for="e-document-number">Número de documento</label><input id="e-document-number" name="documentNumber" maxlength="20" required></div>
            </div>
            <label for="e-full-name">Nombre completo</label><input id="e-full-name" name="fullName" maxlength="120" required>
            <div class="form-row">
              <div><label for="e-phone">Teléfono</label><input id="e-phone" name="phone" maxlength="20" required></div>
              <div><label for="e-email">Correo <span class="optional">Opcional</span></label><input id="e-email" name="email" type="email" maxlength="120"></div>
            </div>
            <button type="submit">Guardar cambios</button>
          </form>
        </div>
        <div>
          <h4>Vehículos asociados</h4>
          <div class="table-wrap"><table><thead><tr><th>Placa</th><th>Tipo</th></tr></thead><tbody id="vehicles-body"></tbody></table></div>
          <form id="vehicle-form">
            <div class="form-row">
              <div><label for="v-plate">Placa</label><input id="v-plate" name="plate" maxlength="10" minlength="5" required placeholder="Ej. ABC123"></div>
              <div><label for="v-type">Tipo de vehículo</label>
                <select id="v-type" name="vehicleType"><option value="AUTOMOVIL">Automóvil</option><option value="MOTOCICLETA">Motocicleta</option><option value="CAMIONETA">Camioneta</option><option value="OTRO">Otro</option></select></div>
            </div>
            <button type="submit">Asociar vehículo</button>
          </form>
        </div>
      </div>
    </section>
    <footer>Autos Colombia · Iteración 2 · Gestión de clientes y celdas</footer>
  </main>
  <script type="module" src="/js/clientes.js"></script>
</body>
</html>
